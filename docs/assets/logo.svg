<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="240" height="96" role="img" aria-labelledby="logoTitle logoDesc">
  <!--
    Palette reason: two core colours plus one accent, derived from the subject.
    Ink (#1f2933) is the base, used for the "token" morpheme, standing for the
    raw encoded material the tool reads. Amber (#b45309) is the single accent,
    applied only to the "scope" morpheme, the inspecting act that is the tool's
    purpose and the thing the reader should look at first. Steel (#52616b) is a
    neutral used for the tagline. No AI-default palette, no gradients, no glow.
    The colon between the morphemes is a literal nod to compact JWT segments
    being joined by punctuation.
  -->
  <title id="logoTitle">tokenscope wordmark</title>
  <desc id="logoDesc">The name tokenscope with the token morpheme in ink and the scope morpheme in amber, over a monospace tagline reading JWT and JWS structural auditor.</desc>
  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>
  <g font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-weight="700">
    <text x="20" y="52" font-size="34" fill="#1f2933">token</text>
    <text x="120" y="52" font-size="34" fill="#b45309">scope</text>
  </g>
  <text x="20" y="76" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#52616b">JWT and JWS structural auditor</text>
</svg>

