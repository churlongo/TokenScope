<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: token inspection. Ink lifted to #e6edf3 carries the "token"
  half and the structural text on #0d1117. The single accent, amber lifted to
  #e0a458, carries the "scope" half and the one finding the reader looks at
  first, the expired claim. Steel #8b949e is the only neutral used for muted
  copy. Contrast on #0d1117: ink 14.6:1, amber 9.1:1, muted 6.3:1.
  Grid: every edge and baseline on a multiple of 4. No glow, no blur, no
  gradients as decoration. Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img"
     aria-labelledby="bannerTitle bannerDesc" width="1400" height="360">
  <title id="bannerTitle">TokenScope banner</title>
  <desc id="bannerDesc">TokenScope, an offline JWT and JWS structural auditor. A
    claim audit card shows an expired token, a policy finding, and a coverage
    summary.</desc>

  <rect x="0" y="0" width="1400" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="64" y="120" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="700"><tspan fill="#e6edf3">token</tspan><tspan fill="#e0a458">scope</tspan></text>

  <text x="64" y="168" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3">Offline JWT and JWS structural auditor</text>
  <text x="64" y="200" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Decode. Coverage. Policy. Deterministic reports.</text>

  <rect x="64" y="248" width="104" height="36" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="116" y="271" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">v1.0.1</text>
  <rect x="184" y="248" width="80" height="36" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="224" y="271" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">MIT</text>
  <rect x="280" y="248" width="168" height="36" rx="6" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="364" y="271" text-anchor="middle" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="15" fill="#8b949e">Python 3.11+</text>

  <rect x="800" y="56" width="536" height="248" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="832" y="96" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#8b949e">token 3 of 6</text>
  <line x1="832" y1="112" x2="1304" y2="112" stroke="#30363d" stroke-width="1"/>

  <circle cx="840" cy="144" r="6" fill="#e0a458"/>
  <text x="864" y="150" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">exp    expired 2 days ago</text>

  <circle cx="840" cy="192" r="6" fill="#8b949e"/>
  <text x="864" y="198" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">alg    HS256, allow list ok</text>

  <circle cx="840" cy="240" r="6" fill="#e0a458"/>
  <text x="864" y="246" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">aud    expected api, got web</text>

  <circle cx="840" cy="288" r="6" fill="#3fb950"/>
  <text x="864" y="294" font-family="&quot;Cascadia Mono&quot;, Consolas, monospace" font-size="16" fill="#e6edf3">coverage 6 of 8 claims seen</text>
</svg>
