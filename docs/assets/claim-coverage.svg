<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="ccTitle ccDesc">
  <!--
    Palette reason: two core colours plus one accent, derived from the subject.
    Ink (#1f2933) for text and present-claim cells, meaning verified structure.
    Steel (#52616b) neutral for absent-claim marks and gridlines. Amber
    (#b45309) is the single accent, used only for the fired-finding rule ids,
    the thing an auditor acts on first. No AI-default palette, no gradient
    (the fills are flat, no severity ramp is claimed), no glow, no grid paper.
    All values come from running: PYTHONPATH=src python -m tokenscope audit
    samples/tokens.txt and inspect samples/tokens.txt at NOW = 1767225600.
  -->
  <title id="ccTitle">Claim coverage and fired findings per sample token</title>
  <desc id="ccDesc">A matrix of the six bundled test tokens. Columns iss, sub, aud, exp, nbf, iat show a filled cell when the registered claim is present and an open dash when absent. The final column lists the finding rule ids that fired for each token from a real audit run.</desc>
  <rect x="0" y="0" width="620" height="300" fill="#ffffff"/>

  <!-- Column headers -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#1f2933">
    <text x="16" y="34">token</text>
    <text x="196" y="34" text-anchor="middle">iss</text>
    <text x="244" y="34" text-anchor="middle">sub</text>
    <text x="292" y="34" text-anchor="middle">aud</text>
    <text x="340" y="34" text-anchor="middle">exp</text>
    <text x="388" y="34" text-anchor="middle">nbf</text>
    <text x="436" y="34" text-anchor="middle">iat</text>
    <text x="472" y="34">findings</text>
  </g>
  <line x1="16" y1="42" x2="604" y2="42" stroke="#52616b" stroke-width="1"/>

  <!-- Row 0: good -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11">
    <text x="16" y="70" fill="#1f2933">[0] good</text>
    <rect x="184" y="60" width="24" height="14" fill="#1f2933"/>
    <rect x="232" y="60" width="24" height="14" fill="#1f2933"/>
    <rect x="280" y="60" width="24" height="14" fill="#1f2933"/>
    <rect x="328" y="60" width="24" height="14" fill="#1f2933"/>
    <rect x="376" y="60" width="24" height="14" fill="#1f2933"/>
    <rect x="424" y="60" width="24" height="14" fill="#1f2933"/>
    <text x="472" y="71" fill="#b45309">TS004</text>
  </g>

  <!-- Row 1: none -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11">
    <text x="16" y="98" fill="#1f2933">[1] none</text>
    <rect x="184" y="88" width="24" height="14" fill="#1f2933"/>
    <rect x="232" y="88" width="24" height="14" fill="#1f2933"/>
    <rect x="280" y="88" width="24" height="14" fill="#1f2933"/>
    <rect x="328" y="88" width="24" height="14" fill="#1f2933"/>
    <line x1="384" y1="95" x2="400" y2="95" stroke="#52616b" stroke-width="1.5"/>
    <rect x="424" y="88" width="24" height="14" fill="#1f2933"/>
    <text x="472" y="99" fill="#b45309">TS002</text>
  </g>

  <!-- Row 2: expired -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11">
    <text x="16" y="126" fill="#1f2933">[2] expired</text>
    <rect x="184" y="116" width="24" height="14" fill="#1f2933"/>
    <rect x="232" y="116" width="24" height="14" fill="#1f2933"/>
    <rect x="280" y="116" width="24" height="14" fill="#1f2933"/>
    <rect x="328" y="116" width="24" height="14" fill="#1f2933"/>
    <line x1="384" y1="123" x2="400" y2="123" stroke="#52616b" stroke-width="1.5"/>
    <rect x="424" y="116" width="24" height="14" fill="#1f2933"/>
    <text x="472" y="127" fill="#b45309">TS004, TS008</text>
  </g>

  <!-- Row 3: missing aud -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11">
    <text x="16" y="154" fill="#1f2933">[3] no-aud</text>
    <rect x="184" y="144" width="24" height="14" fill="#1f2933"/>
    <rect x="232" y="144" width="24" height="14" fill="#1f2933"/>
    <line x1="288" y1="151" x2="304" y2="151" stroke="#52616b" stroke-width="1.5"/>
    <rect x="328" y="144" width="24" height="14" fill="#1f2933"/>
    <line x1="384" y1="151" x2="400" y2="151" stroke="#52616b" stroke-width="1.5"/>
    <rect x="424" y="144" width="24" height="14" fill="#1f2933"/>
    <text x="472" y="155" fill="#b45309">TS004, TS006</text>
  </g>

  <!-- Row 4: excessive lifetime -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11">
    <text x="16" y="182" fill="#1f2933">[4] long-life</text>
    <rect x="184" y="172" width="24" height="14" fill="#1f2933"/>
    <rect x="232" y="172" width="24" height="14" fill="#1f2933"/>
    <rect x="280" y="172" width="24" height="14" fill="#1f2933"/>
    <rect x="328" y="172" width="24" height="14" fill="#1f2933"/>
    <line x1="384" y1="179" x2="400" y2="179" stroke="#52616b" stroke-width="1.5"/>
    <rect x="424" y="172" width="24" height="14" fill="#1f2933"/>
    <text x="472" y="183" fill="#b45309">TS004, TS011</text>
  </g>

  <!-- Row 5: corrupt payload -->
  <g font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="11">
    <text x="16" y="210" fill="#1f2933">[5] corrupt</text>
    <line x1="192" y1="207" x2="208" y2="207" stroke="#52616b" stroke-width="1.5"/>
    <line x1="240" y1="207" x2="256" y2="207" stroke="#52616b" stroke-width="1.5"/>
    <line x1="288" y1="207" x2="304" y2="207" stroke="#52616b" stroke-width="1.5"/>
    <line x1="336" y1="207" x2="352" y2="207" stroke="#52616b" stroke-width="1.5"/>
    <line x1="384" y1="207" x2="400" y2="207" stroke="#52616b" stroke-width="1.5"/>
    <line x1="432" y1="207" x2="448" y2="207" stroke="#52616b" stroke-width="1.5"/>
    <text x="472" y="211" fill="#b45309">TS000, TS004</text>
  </g>

  <line x1="16" y1="226" x2="604" y2="226" stroke="#52616b" stroke-width="1"/>

  <!-- Legend -->
  <g font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933">
    <rect x="16" y="248" width="18" height="12" fill="#1f2933"/>
    <text x="42" y="258">claim present</text>
    <line x1="150" y1="254" x2="166" y2="254" stroke="#52616b" stroke-width="1.5"/>
    <text x="174" y="258">claim absent</text>
    <rect x="280" y="248" width="18" height="12" fill="#b45309"/>
    <text x="306" y="258">finding fired (rule id)</text>
  </g>
  <text x="16" y="284" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="10" fill="#52616b">source: tokenscope audit and inspect over samples/tokens.txt, NOW=1767225600</text>
</svg>

